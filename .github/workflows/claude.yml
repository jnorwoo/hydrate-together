# Lets Claude work on issues and PRs right inside GitHub.
#  - Mention @claude in any issue or PR comment, or
#  - add the label "agent: claude" to an issue.
# Needs one secret: CLAUDE_CODE_OAUTH_TOKEN (set up with `claude setup-token`, see README).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent: claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "agent: claude"
          prompt: ${{ github.event_name == 'issues' && 'Implement this issue following AGENTS.md. Open a PR when done.' || '' }}
