name: 🐞 Something's broken
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: "e.g. I tapped Glass but the number didn't go up"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: device
    attributes:
      label: What were you using? (optional)
      placeholder: "e.g. iPhone, Safari"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag a picture in here if you have one.
